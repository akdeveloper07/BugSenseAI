
apiVersion: apps/v2
kind: Deployment
metadata:
  name: bugsense-ai
  labels:
    app: bugsense-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bugsense-ai
  template:
    metadata:
      labels:
        app: bugsense-ai
    spec:
      containers:
        - name: bugsense-ai
          image: akash0708/bugsense-ai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: bugsense-ai-service
spec:
  type: NodePort
  selector:
    app: bugsense-ai
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30080
